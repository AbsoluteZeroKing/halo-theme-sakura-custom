apiVersion: theme.halo.run/v1alpha1
kind: Theme
spec:
  customTemplates:
    page:
      - name: 友情链接
        description: 支持可预设文本的友链
        screenshot: 
        file: page_links.html
  displayName: Sakura Custom
  author:
    name: lizengshuai
    website: https://github.com/AbsoluteZeroKing
  description: 基于 Sakura 主题的定制版本，支持更多自定义功能
  logo: /themes/theme-sakura-custom/assets/images/search/iloli.gif
  website: https://github.com/lizengshuai/halo-theme-sakura-custom
  repo: https://github.com/lizengshuai/halo-theme-sakura-custom.git
  settingName: theme-sakura-custom-setting
  configMapName: theme-sakura-custom-configMap
  # 通过 vite 环境变量 (VITE_THEME_VERSION) 配置，这里不需要配置。
  version: 1.0.0
  require: ">=2.19.0"
metadata:
  name: theme-sakura-custom
